name: Build GOASalert AAB - API36 v4
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Crear App
        run: |
          rm -rf android www node_modules
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www && cp index.html www/index.html
          echo '{"appId":"com.institutogoas.goasalert","appName":"GOASalert","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Build AAB API36 v4
        run: |
          cd android
          # Forzar API 36 y version 4 en todos los gradle
          find . -name "build.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' {} \;
          find . -name "build.gradle" -exec sed -i 's/compileSdk.*/compileSdk 36/' {} \;
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion.*/targetSdkVersion 36/' {} \;
          find . -name "build.gradle" -exec sed -i 's/targetSdk.*/targetSdk 36/' {} \;
          sed -i 's/versionCode.*/versionCode 4/' app/build.gradle
          sed -i 's/versionName.*/versionName "4.0"/' app/build.gradle
          
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GOASalert-API36-v4-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
