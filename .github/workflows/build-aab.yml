name: Build AAB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Crear keystore fijo
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > goasalert.keystore || keytool -genkey -v -keystore goasalert.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass goasalert123 -keypass goasalert123 -dname "CN=GOASalert, OU=GOAS, O=Instituto GOAS, L=Reus, S=Tarragona, C=ES"
          keytool -export -rfc -keystore goasalert.keystore -alias upload -storepass goasalert123 -file upload_certificate.pem
          flutter pub get
          flutter build appbundle --release --build-number=${{ github.run_number }} --build-name=1.2 --no-tree-shake-icons -v
      - uses: actions/upload-artifact@v4
        with:
          name: goasalert-aab-firmado
          path: build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: goasalert-keystore-y-pem
          path: |
            goasalert.keystore
            upload_certificate.pem
