name: Crear AAB GOASalert
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar
        run: npm init -y || true
      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Iniciar
        run: npx cap init GOASalert com.institutogoas.goasalert --web-dir=. || true
      - name: Add Android
        run: npx cap add android || true
      - name: Copy
        run: npx cap copy android
      - name: Build AAB
        run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: goasalert-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
