name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        # si usas ionic: npx ionic build

      - name: Add and Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Keystore
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/goasalert-final.keystore -alias goas-final -keyalg RSA -keysize 2048 -validity 10000 -storepass ${{ secrets.KEYSTORE_PASSWORD || 'goas123456' }} -keypass ${{ secrets.KEY_PASSWORD || 'goas123456' }} -dname "CN=GOAS Final, OU=GOAS, O=GOAS, L=Reus, S=Catalunya, C=ES"
          # Si ya tienes keystore en Secrets, usa este en vez de generar:
          # echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/goasalert-final.keystore
        working-directory: android

      - name: Create keystore.properties
        run: |
          echo "storeFile=goasalert-final.keystore" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD || 'goas123456' }}" >> keystore.properties
          echo "keyAlias=goas-final" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD || 'goas123456' }}" >> keystore.properties
        working-directory: android

      - name: Build AAB Release
        run:./gradlew bundleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: goasalert-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
