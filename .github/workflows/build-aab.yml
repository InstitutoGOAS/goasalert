name: Crear AAB GOASalert
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Limpiar
        run: rm -rf android
      - name: Preparar
        run: npm init -y || true
      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Crear config manual
        run: echo '{"appId":"com.institutogoas.goasalert","appName":"GOASalert","webDir":".","bundledWebRuntime":false}' > capacitor.config.json && cat capacitor.config.json
      - name: Add Android limpio
        run: npx cap add android
      - name: Copy y Sync
        run: npx cap copy android && npx cap sync android
      - name: Build AAB
        run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: goasalert-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
