name: Crear AAB GOASalert
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Limpiar
        run: rm -rf android www
      - name: Preparar
        run: npm init -y || true
      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Crear www y config
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || echo "<html><body><h1>GOASalert</h1></body></html>" > www/index.html
          cp -r *.js *.css *.json www/ 2>/dev/null || true
          echo '{"appId":"com.institutogoas.goasalert","appName":"GOASalert","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
      - name: Add Android
        run: npx cap add android
      - name: Fix duplicado, firma y version
        run: |
          sed -i "/^android {/i configurations {\n implementation {\n exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n }\n}\n" android/app/build.gradle
          keytool -genkey -v -keystore android/app/goasalert.keystore -storepass goasalert123 -alias goasalert -keypass goasalert123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GOASalert, OU=InstitutoGOAS, O=InstitutoGOAS, L=Reus, ST=Catalunya, C=ES"
          sed -i "/^android {/a \ signingConfigs {\n release {\n storeFile file('goasalert.keystore')\n storePassword 'goasalert123'\n keyAlias 'goasalert'\n keyPassword 'goasalert123'\n }\n }" android/app/build.gradle
          sed -i "s/buildTypes {/buildTypes {\n release {\n signingConfig signingConfigs.release\n }/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode 2/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.1\"/" android/app/build.gradle
      - name: Build AAB firmado
        run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: goasalert-aab-firmado
          path: android/app/build/outputs/bundle/release/app-release.aab
