name: Build GOASalert AAB - API36 FIX KEY v5.1
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
          rm -rf android && mkdir -p android/app/src/main/assets android/app/src/main/java/com/institutogoas/goasalert
          cp index.html android/app/src/main/assets/index.html
          echo "include ':app'" > android/settings.gradle
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:8.6.0'}}allprojects{repositories{google();mavenCentral()}}" > android/build.gradle
          printf "plugins { id 'com.android.application' }\nandroid { namespace 'com.institutogoas.goasalert'\ncompileSdk 36\ndefaultConfig { applicationId \"com.institutogoas.goasalert\"; minSdk 22; targetSdk 36; versionCode 5; versionName \"5.0\" }\nsigningConfigs { release { storeFile file('goasalert-final.keystore'); storePassword 'goasalert123'; keyAlias 'upload'; keyPassword 'goasalert123' } }\nbuildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } } }\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }\n" > android/app/build.gradle
          printf "package com.institutogoas.goasalert;import android.app.Activity;import android.os.Bundle;import android.webkit.WebView;import android.webkit.WebViewClient;public class MainActivity extends Activity{protected void onCreate(Bundle b){super.onCreate(b);WebView w=new WebView(this);w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.setWebViewClient(new WebViewClient());w.loadUrl(\"file:///android_asset/index.html\");setContentView(w);}}\n" > android/app/src/main/java/com/institutogoas/goasalert/MainActivity.java
          printf "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"><uses-permission android:name=\"android.permission.INTERNET\"/><application android:allowBackup=\"false\" android:label=\"GOASalert\" android:theme=\"@android:style/Theme.NoTitleBar\"><activity android:name=\".MainActivity\" android:exported=\"true\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>\n" > android/app/src/main/AndroidManifest.xml
          cd android
          keytool -genkey -v -keystore app/goasalert-final.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass goasalert123 -keypass goasalert123 -dname "CN=GOASalert Final, OU=GOAS, O=GOAS, L=Reus, S=Tarragona, C=ES"
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip && unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon
          keytool -export -rfc -keystore app/goasalert-final.keystore -alias upload -storepass goasalert123 -file app/upload_certificate.pem
      - uses: actions/upload-artifact@v4
        with:
          name: GOASalert-v5-FIXED
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/upload_certificate.pem
            android/app/goasalert-final.keystore
